
name: Deploy SuratNX to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suratnx-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure secure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest main branch
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" 'bash -se' <<'EOF'
          set -e
          cd /var/www/suratnx

          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"

          git fetch origin main
          git merge --ff-only origin/main

          test -f index.html

          echo "DEPLOYED COMMIT:"
          git log -1 --oneline
          EOF

      - name: Verify live website
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            https://suratnx.com/ > /dev/null
          echo "SuratNX website is responding successfully"
